services:
  tg-manager:
    build: .
    container_name: tg_manager
    command: ["python", "-u", "manager_bot.py"]
    env_file:
      - .env

    # 网络配置优化
    networks:
      - tg-network
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4

    # TCP 连接优化
    sysctls:
      - net.ipv4.tcp_keepalive_time=600
      - net.ipv4.tcp_keepalive_intvl=60
      - net.ipv4.tcp_keepalive_probes=3
      - net.ipv4.tcp_retries2=5

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./rclone:/root/.config/rclone
      # 如你的宿主机 rclone 是"支持 pikpak 后端"的版本，可挂载覆盖容器内 rclone
      # 注意：把左侧路径改成 `which rclone` 的输出
      - /usr/bin/rclone:/usr/local/bin/rclone:ro
    restart: unless-stopped

  tg-login:
    build: .
    container_name: tg_login
    command: ["python", "-u", "setup_user_session.py"]
    env_file:
      - .env

    # 网络配置优化
    networks:
      - tg-network
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./sessions:/app/sessions
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - ./rclone:/root/.config/rclone
      - /usr/bin/rclone:/usr/local/bin/rclone:ro
    stdin_open: true
    tty: true
    profiles: ["tools"]

  tg-rclone:
    build: .
    container_name: tg_rclone
    entrypoint: ["rclone"]
    command: ["version"]
    env_file:
      - .env

    # 网络配置优化
    networks:
      - tg-network
    dns:
      - 1.1.1.1
      - 8.8.8.8
      - 8.8.4.4

    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./rclone:/root/.config/rclone
      - ./downloads:/app/downloads
      - ./logs:/app/logs
      - /usr/bin/rclone:/usr/local/bin/rclone:ro
    stdin_open: true
    tty: true
    profiles: ["tools"]

# 自定义网络配置
networks:
  tg-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500
    ipam:
      config:
        - subnet: 172.25.0.0/16
